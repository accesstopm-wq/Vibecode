name: Build APK
on:
  push:
    paths: ['**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp
      - run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
        working-directory: minesweeper
      - uses: actions/upload-artifact@v4
        with:
          name: minesweeper-debug-apk
          path: minesweeper/app/build/outputs/apk/debug/app-debug.apk
