<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIDAA Diagnostic</title>
<style>
html,body{margin:0;background:#101114;color:#fff;font-family:Arial,sans-serif}
#page{padding:22px 28px 8px;font-size:24px;font-weight:bold}
#result{padding:8px 28px 28px;white-space:pre-wrap;word-break:break-all;font-size:26px;line-height:1.35}
#hint{position:fixed;bottom:8px;left:28px;color:#aaa;font-size:18px}
</style>
</head>
<body>
<div id="page">Сторінка 1 з 1</div>
<pre id="result">Діагностика…</pre>
<div id="hint">2 — назад · 8 — вперед · ↑/↓ — навігація</div>
<script>
(() => {
  const result=document.getElementById('result');
  const page=document.getElementById('page');

  function safe(v){
    try{return JSON.stringify(v,null,2)}catch(e){return String(v)}
  }

  function call(action,params){
    const out={action,params};
    try{
      if(typeof window.HiUtils_createRequest!=='function'){
        out.error='HiUtils_createRequest is not a function';
        return out;
      }
      const r=window.HiUtils_createRequest(action,params||{});
      out.result=r;
      out.ret=r&&r.ret;
      out.sdkVersion=r&&r.sdkVersion;
      out.code=r&&r.code;
      if(r&&r.msg){
        out.msgType=typeof r.msg;
        if(typeof r.msg==='object') out.msgKeys=Object.keys(r.msg);
        if(typeof r.msg==='string'){
          out.msgLength=r.msg.length;
          try{out.parsedMsg=JSON.parse(r.msg)}catch(e){out.msgParseError=String(e)}
        }
      }
    }catch(e){
      out.exception=String(e);
      out.stack=e&&e.stack?e.stack:null;
    }
    return out;
  }

  function invoke(name,args){
    const out={name,args:args||[]};
    try{
      const fn=window[name];
      if(typeof fn!=='function'){
        out.error='not a function';
        return out;
      }
      out.type='function';
      out.length=fn.length;
      let src='';
      try{src=Function.prototype.toString.call(fn)}catch(e){src='[toString failed]'}
      out.source=src.length>500?src.slice(0,500)+'…':src;
      const r=fn.apply(window,args||[]);
      out.result=r;
      out.resultType=typeof r;
    }catch(e){
      out.exception=String(e);
      out.stack=e&&e.stack?e.stack:null;
    }
    return out;
  }

  const tests=[];

  // Read-only filesystem probes. No fileWrite is executed.
  const paths=[
    'websdk/Appinfo.json',
    'Appinfo.json',
    '/websdk/Appinfo.json',
    'index.html',
    'websdk',
    'websdk/appinfo.json'
  ];
  for(const path of paths) tests.push(call('fileRead',{path,mode:6}));

  // Check whether the result depends on the mode value.
  for(const mode of [0,1,2,4,6]){
    tests.push(call('fileRead',{path:'websdk/Appinfo.json',mode}));
  }

  const ownNames=Object.getOwnPropertyNames(window)
    .filter(n=>/^HiUtils|^Hisense/i.test(n))
    .sort();

  // Inventory every exposed HiUtils_/Hisense_ function: arity + native source.
  // This does not execute setters, login, install/uninstall, or observer registration.
  const functionInventory=[];
  for(const name of ownNames){
    const fn=window[name];
    if(typeof fn==='function'){
      const item={name,length:fn.length,type:'function'};
      try{
        const src=Function.prototype.toString.call(fn);
        item.source=src.length>500?src.slice(0,500)+'…':src;
      }catch(e){item.sourceError=String(e)}
      functionInventory.push(item);
    }
  }

  // Execute zero-argument getters only. These are read-only by naming contract;
  // everything else is inspected but not invoked to avoid changing TV state.
  const getterTests=[];
  for(const name of ownNames){
    if(!/^Hisense_(Get|get)/.test(name)) continue;
    const fn=window[name];
    if(typeof fn!=='function' || fn.length!==0) continue;
    getterTests.push(invoke(name,[]));
  }

  // Explicitly probe the observer APIs without registering callbacks: their
  // arity/source are recorded above, which lets us determine the required
  // signature without accidentally leaving an observer attached.
  const observerSignatures=[];
  for(const name of ['Hisense_RegisterObserver','Hisense_RegisterVolumeObs','Hisense_UnregisterObserver']){
    if(typeof window[name]==='function'){
      observerSignatures.push({
        name,
        length:window[name].length,
        source:(()=>{try{const s=Function.prototype.toString.call(window[name]);return s.length>500?s.slice(0,500)+'…':s}catch(e){return '[toString failed]'}})()
      });
    }
  }

  // Remote-keyboard API is inspected only; it is not called because its
  // arguments are undocumented and a bad call could alter input handling.
  const remoteKeyboardProbe=typeof window.Hisense_SetRemoteKeyboard==='function'
    ? {name:'Hisense_SetRemoteKeyboard',length:window.Hisense_SetRemoteKeyboard.length}
    : {name:'Hisense_SetRemoteKeyboard',present:false};

  const diagnostic={
    diagnosticVersion:'2026-09-08-4',
    location:location.href,
    userAgent:navigator.userAgent,
    api:{
      HiUtils_createRequest:typeof window.HiUtils_createRequest,
      Hisense_FileRead:typeof window.Hisense_FileRead,
      Hisense_FileWrite:typeof window.Hisense_FileWrite,
      Hisense_installApp:typeof window.Hisense_installApp,
      Hisense_uninstallApp:typeof window.Hisense_uninstallApp,
      exposedHiHisenseNames:ownNames
    },
    tests,
    functionInventory,
    getterTests,
    observerSignatures,
    remoteKeyboardProbe
  };

  const text=safe(diagnostic);
  const chunkSize=200;
  const chunks=[];
  for(let i=0;i<text.length;i+=chunkSize) chunks.push(text.slice(i,i+chunkSize));
  let current=0;

  function render(){
    page.textContent=`Сторінка ${current+1} з ${chunks.length}`;
    result.textContent=chunks[current]||'';
  }

  document.addEventListener('keydown',e=>{
    if(e.key==='2'||e.key==='ArrowUp'){
      current=Math.max(0,current-1);
      render();
      e.preventDefault();
    }else if(e.key==='8'||e.key==='ArrowDown'){
      current=Math.min(chunks.length-1,current+1);
      render();
      e.preventDefault();
    }
  });

  render();
})();
</script>
</body>
</html>
