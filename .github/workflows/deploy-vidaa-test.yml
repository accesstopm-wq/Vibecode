name: Deploy VIDAA YouTube player

on:
  push:
    paths:
      - 'youtube-player/**'
      - '.github/workflows/deploy-vidaa-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: youtube-player
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './youtube-player'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
