name: Deploy VIDAA test

on:
  push:
    paths:
      - 'vidaa-test/**'
      - 'vidaa-installer/**'
      - 'vidaa-appinfo/**'
      - 'vidaa-diagnostic/**'
      - 'vidaa-player/**'
      - 'vidaa-remote-test/**'
      - '.github/workflows/deploy-vidaa-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r vidaa-test/* _site/
          mkdir -p _site/vidaa-installer
          cp -r vidaa-installer/* _site/vidaa-installer/
          mkdir -p _site/vidaa-appinfo
          cp -r vidaa-appinfo/* _site/vidaa-appinfo/
          mkdir -p _site/vidaa-diagnostic
          cp -r vidaa-diagnostic/* _site/vidaa-diagnostic/
          mkdir -p _site/vidaa-player
          cp -r vidaa-player/* _site/vidaa-player/
          mkdir -p _site/vidaa-remote-test
          cp -r vidaa-remote-test/* _site/vidaa-remote-test/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
