name: Deploy VIDAA config proxy

on:
  push:
    paths:
      - 'vidaa-config-proxy/**'
      - '.github/workflows/deploy-vidaa-config-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vidaa-config-proxy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: vidaa-config-proxy
          fetch-depth: 1

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Get or create KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TITLE='vidaa-tunnel-config'
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          LIST=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API?per_page=1000")
          ID=$(printf '%s' "$LIST" | jq -r --arg title "$TITLE" '.result[] | select(.title == $title) | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST "$API" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "{\"title\":\"$TITLE\"}" | jq -r '.result.id')
          fi
          test -n "$ID" && test "$ID" != null
          echo "KV_ID=$ID" >> "$GITHUB_ENV"

      - name: Prepare Wrangler config
        run: |
          jq --arg id "$KV_ID" '.kv_namespaces[0].id = $id' vidaa-config-proxy/wrangler.jsonc > /tmp/wrangler.jsonc
          mv /tmp/wrangler.jsonc vidaa-config-proxy/wrangler.jsonc

      - name: Deploy Worker
        working-directory: vidaa-config-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIDAA_CONFIG_TOKEN: ${{ secrets.VIDAA_CONFIG_TOKEN }}
        run: |
          set -euo pipefail
          printf '{"UPDATE_TOKEN":"%s"}\n' "$VIDAA_CONFIG_TOKEN" > /tmp/worker-secrets.json
          npx wrangler deploy --config wrangler.jsonc --secrets-file /tmp/worker-secrets.json 2>&1 | tee /tmp/deploy.log
          rm -f /tmp/worker-secrets.json
          WORKER_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -1)
          test -n "$WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Update Pages config to stable proxy URL
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/youtube-player/backend-url.json"
          CURRENT=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API?ref=main")
          SHA=$(printf '%s' "$CURRENT" | jq -r '.sha')
          CONTENT=$(printf '{"apiBase":"%s"}\n' "$WORKER_URL" | base64 -w0)
          curl -fsS -X PUT "$API" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d "$(jq -n --arg message 'Point VIDAA player at stable config proxy' --arg content "$CONTENT" --arg sha "$SHA" '{message:$message,content:$content,sha:$sha,branch:"main"}')"
