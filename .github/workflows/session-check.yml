name: Session check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r auth-session-export/requirements.txt
      - name: Run authentication check
        env:
          AD_URL: ${{ secrets.AD_URL }}
          AD_LOGIN: ${{ secrets.AD_LOGIN }}
          AD_PASS: ${{ secrets.AD_PASS }}
        run: python auth-session-export/login.py
      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-status
          path: auth_status.json
          if-no-files-found: warn
          retention-days: 1
