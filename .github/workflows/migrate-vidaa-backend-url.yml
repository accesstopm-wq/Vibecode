name: Migrate VIDAA backend URL

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate-vidaa-backend-url.yml'

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Switch player to GitHub-hosted config
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('youtube-player/index.html')
          s = p.read_text(encoding='utf-8')
          old = "function loadConfig(){requestJson('backend-url.json?ts='+Date.now(),function(c){"
          new = "function loadConfig(){requestJson('https://raw.githubusercontent.com/accesstopm-wq/Vibecode/main/vidaa-backend-url.json?ts='+Date.now(),function(c){"
          if old not in s:
              raise SystemExit('Expected loadConfig code was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f youtube-player/backend-url.json

      - name: Commit migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-player/index.html youtube-player/backend-url.json
          git commit -m 'Use GitHub raw config for VIDAA tunnel URL'
          git push origin main

      - name: Deploy Pages with migrated player
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-vidaa-test.yml --ref main
