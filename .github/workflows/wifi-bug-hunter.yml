name: Build WiFi Bug Hunter

on:
  push:
    paths:
      - 'wifi-bug-hunter/**'
      - '.github/workflows/wifi-bug-hunter.yml'
  pull_request:
    paths:
      - 'wifi-bug-hunter/**'
      - '.github/workflows/wifi-bug-hunter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: wifi-bug-hunter
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-bug-hunter-apk
          path: wifi-bug-hunter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
