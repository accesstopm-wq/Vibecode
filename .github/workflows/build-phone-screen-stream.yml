name: Build Phone Screen Stream APK
on:
  push:
    paths:
      - 'phone-screen-stream-apk/**'
      - '.github/workflows/build-phone-screen-stream.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-screen-stream-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: phone-screen-stream-debug-apk
          path: phone-screen-stream-apk/app/build/outputs/apk/debug/app-debug.apk
