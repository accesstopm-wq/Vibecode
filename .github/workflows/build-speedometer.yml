name: Build Speedometer APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'speedometer/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speedometer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: speedometer-debug-apk
          path: speedometer/app/build/outputs/apk/debug/app-debug.apk
