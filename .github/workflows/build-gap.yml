name: Run GAP

on:
  push:
    paths:
      - 'gap/test.g'
      - '.github/workflows/build-gap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gap-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gap:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gap-system/gap:4.15.1-slim
      options: --user 0

    steps:
      - uses: actions/checkout@v4

      - name: Run GAP
        run: gap -q "${GITHUB_WORKSPACE}/gap/test.g" > "${GITHUB_WORKSPACE}/gap/result.txt"

      - name: Commit generated result
        run: |
          git -C "${GITHUB_WORKSPACE}" config user.name "github-actions[bot]"
          git -C "${GITHUB_WORKSPACE}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${GITHUB_WORKSPACE}" add gap/result.txt
          git -C "${GITHUB_WORKSPACE}" diff --cached --quiet || git -C "${GITHUB_WORKSPACE}" commit -m "Update GAP result"
          git -C "${GITHUB_WORKSPACE}" push

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: gap-result
          path: ${{ github.workspace }}/gap/result.txt
