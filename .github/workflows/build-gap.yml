name: Run GAP

on:
  push:
    paths:
      - 'gap/test.g'
      - '.github/workflows/build-gap.yml'
  workflow_dispatch:

jobs:
  gap:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gap-system/gap:4.15.1-slim
      options: --user 0

    steps:
      - uses: actions/checkout@v4

      - name: Run GAP
        run: |
          gap -q "${GITHUB_WORKSPACE}/gap/test.g" | tee "${GITHUB_WORKSPACE}/gap/result.txt"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: gap-result
          path: ${{ github.workspace }}/gap/result.txt
