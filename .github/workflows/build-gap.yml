name: Run GAP

on:
  push:
    paths:
      - 'gap/**'
      - '.github/workflows/build-gap.yml'
  workflow_dispatch:

jobs:
  gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GAP
        run: |
          sudo apt-get update
          sudo apt-get install -y gap

      - name: Run all GAP code
        run: gap -q gap/test.g > gap/result.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: gap-result
          path: gap/result.txt
