name: Run GAP

on:
  push:
    paths:
      - 'gap/test.g'
      - '.github/workflows/build-gap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gap:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homalg-project/gap-docker:latest

    steps:
      - uses: actions/checkout@v4

      - name: Run GAP
        run: gap -q gap/test.g > gap/result.txt

      - name: Commit generated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gap/result.txt
          git diff --cached --quiet || git commit -m "Update GAP result"
          git push

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: gap-result
          path: gap/result.txt
