name: GAP JupyterLab

on:
  workflow_dispatch:

jobs:
  jupyter:
    name: Interactive GAP JupyterLab
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/gap-jupyter/notebooks"
          chmod -R 777 "$GITHUB_WORKSPACE/gap-jupyter/notebooks"

      - name: Pull GAP + JupyterLab image
        run: docker pull ghcr.io/gap-system/jupyter-gap:4.15.0-full

      - name: Start GAP JupyterLab
        env:
          JUPYTER_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-gap
        run: |
          docker rm -f gap-jupyter 2>/dev/null || true
          docker run -d \
            --name gap-jupyter \
            -p 127.0.0.1:8888:8888 \
            -e JUPYTER_TOKEN="$JUPYTER_TOKEN" \
            -e JUPYTER_GAP_EXECUTABLE=gap \
            -v "$GITHUB_WORKSPACE/gap-jupyter/notebooks:/workspace" \
            ghcr.io/gap-system/jupyter-gap:4.15.0-full \
            sh -lc 'python3 -m pip install --user --no-cache-dir "jupyterlab==3.6.8" "notebook==6.5.7" && exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.token="$JUPYTER_TOKEN" --ServerApp.root_dir=/workspace --ServerApp.allow_remote_access=True --ServerApp.trust_xheaders=True --ServerApp.allow_origin="*"'

          echo "Waiting for JupyterLab and GAP kernel..."
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8888/lab >/dev/null 2>&1; then
              echo "JupyterLab is ready."
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "JupyterLab failed to start."
              docker logs gap-jupyter || true
              exit 1
            fi
            sleep 2
          done

          echo "Jupyter versions:"
          docker exec gap-jupyter python3 -c 'import jupyterlab, notebook; print("JupyterLab", jupyterlab.__version__); print("Notebook", notebook.__version__)'
          echo "Container status:"
          docker ps --filter name=gap-jupyter
          echo "Jupyter kernels:"
          docker exec gap-jupyter jupyter kernelspec list || true
          echo "GAP executable:"
          docker exec gap-jupyter sh -lc 'command -v gap; command -v jupyter-kernel-gap; echo JUPYTER_GAP_EXECUTABLE=$JUPYTER_GAP_EXECUTABLE'
          echo "GAP package check:"
          docker exec gap-jupyter gap -q -c 'Print(LoadPackage("JupyterKernel"),"\\n"); QUIT;'

      - name: Test GAP kernel end-to-end
        run: |
          docker exec -i gap-jupyter python3 - <<'PY'
          from jupyter_client import KernelManager

          km = KernelManager(kernel_name="gap-4")
          km.start_kernel(cwd="/workspace")
          kc = km.client()
          kc.start_channels()
          try:
              kc.wait_for_ready(timeout=30)
              msg_id = kc.execute("2+2;")
              got_result = False
              while True:
                  msg = kc.get_iopub_msg(timeout=30)
                  if msg["parent_header"].get("msg_id") != msg_id:
                      continue
                  typ = msg["msg_type"]
                  content = msg["content"]
                  if typ == "execute_result":
                      print("GAP EXECUTE_RESULT:", content["data"])
                      got_result = True
                  elif typ == "stream":
                      print("GAP STREAM:", content["text"], end="")
                  elif typ == "error":
                      print("GAP ERROR:", content["ename"], content["evalue"])
                      raise SystemExit(1)
                  elif typ == "status" and content["execution_state"] == "idle":
                      break
              if not got_result:
                  raise RuntimeError("GAP kernel reached idle without an execute_result")
              print("GAP KERNEL TEST: OK")
          finally:
              kc.stop_channels()
              km.shutdown_kernel(now=True)
          PY

      - name: Install cloudflared
        run: |
          curl -L --fail --retry 3 \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Cloudflare tunnel
        env:
          JUPYTER_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-gap
        run: |
          nohup ./cloudflared tunnel --url http://127.0.0.1:8888 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          URL=""
          for i in {1..60}; do
            URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Cloudflare tunnel failed to start."
            cat tunnel.log
            exit 1
          fi

          echo "============================================================"
          echo "GAP JUPYTERLAB IS READY"
          echo "JUPYTER_URL: ${URL}/lab?token=${JUPYTER_TOKEN}"
          echo "============================================================"
          echo "TUNNEL_PID=$TUNNEL_PID" >> "$GITHUB_ENV"

      - name: Keep JupyterLab alive
        run: |
          echo "JupyterLab will remain available until the GitHub-hosted runner limit."
          while kill -0 "$TUNNEL_PID" 2>/dev/null; do
            if ! docker ps --format '{{.Names}}' | grep -qx 'gap-jupyter'; then
              echo "Jupyter container stopped."
              docker logs gap-jupyter || true
              exit 1
            fi
            sleep 30
          done
          echo "Cloudflare tunnel stopped."
          docker logs gap-jupyter || true
          exit 1
