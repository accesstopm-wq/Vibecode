name: GAP JupyterLab

on:
  push:
    paths:
      - 'gap-jupyter/youtube_backend.py'
      - '.github/workflows/gap-jupyter.yml'
  workflow_dispatch:

concurrency:
  group: gap-jupyter
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  jupyter:
    name: Interactive GAP JupyterLab
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/gap-jupyter"
          chmod -R 777 "$GITHUB_WORKSPACE/gap-jupyter"

      - name: Pull GAP + JupyterLab image
        run: docker pull ghcr.io/gap-system/jupyter-gap:4.15.0-full

      - name: Start GAP, Telegram bot, PO token provider and YouTube backend
        env:
          JUPYTER_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-gap
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          docker rm -f gap-jupyter 2>/dev/null || true
          docker run -d \
            --name gap-jupyter \
            -p 127.0.0.1:8888:8888 \
            -p 127.0.0.1:8765:8765 \
            -e JUPYTER_TOKEN="$JUPYTER_TOKEN" \
            -e JUPYTER_GAP_EXECUTABLE=gap \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            -e YOUTUBE_BACKEND_PORT=8765 \
            -v "$GITHUB_WORKSPACE/gap-jupyter:/workspace" \
            ghcr.io/gap-system/jupyter-gap:4.15.0-full \
            sh -lc 'set -e; ln -sf /workspace/save-to-github.py /opt/gap/.local/bin/save-to-github; python3 -m pip install --user --no-cache-dir "jupyterlab==3.6.8" "notebook==6.5.7" "python-telegram-bot" "requests" "yt-dlp" "bgutil-ytdlp-pot-provider"; curl -fsSL https://deno.land/install.sh | sh; export PATH="/opt/gap/.deno/bin:$PATH"; rm -rf /workspace/bgutil-ytdlp-pot-provider; git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /workspace/bgutil-ytdlp-pot-provider; cd /workspace/bgutil-ytdlp-pot-provider/server; /opt/gap/.deno/bin/deno install --allow-scripts=npm:canvas --frozen; nohup /opt/gap/.deno/bin/deno run --allow-env --allow-net --allow-ffi=. --allow-read=. src/main.ts --host 127.0.0.1 --port 4416 > /workspace/bgutil.log 2>&1 & echo $! > /tmp/bgutil.pid; cd /workspace; nohup python3 /workspace/youtube_backend.py > /workspace/youtube-backend.log 2>&1 & echo $! > /tmp/youtube-backend.pid; python3 /workspace/bot.py > /workspace/bot.log 2>&1 & echo $! > /tmp/bot.pid; exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.token="$JUPYTER_TOKEN" --ServerApp.root_dir=/workspace --ServerApp.allow_remote_access=True --ServerApp.trust_xheaders=True --ServerApp.allow_origin="*"'

          echo "Waiting for JupyterLab and GAP kernel..."
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8888/lab >/dev/null 2>&1; then echo "JupyterLab is ready."; break; fi
            if [ "$i" -eq 90 ]; then echo "JupyterLab failed to start."; docker logs gap-jupyter || true; exit 1; fi
            sleep 2
          done

          echo "Waiting for PO token provider..."
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4416/ >/dev/null 2>&1 || curl -fsS http://127.0.0.1:4416/health >/dev/null 2>&1; then echo "PO token provider is ready."; break; fi
            if [ "$i" -eq 90 ]; then echo "PO token provider failed to start."; docker exec gap-jupyter sh -lc 'cat /workspace/bgutil.log 2>/dev/null || true'; exit 1; fi
            sleep 2
          done

          echo "Waiting for YouTube backend..."
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then echo "YouTube backend is ready."; break; fi
            if [ "$i" -eq 60 ]; then echo "YouTube backend failed to start."; docker logs gap-jupyter || true; exit 1; fi
            sleep 2
          done

          echo "Jupyter versions:"
          docker exec gap-jupyter python3 -c 'import jupyterlab, notebook; print("JupyterLab", jupyterlab.__version__); print("Notebook", notebook.__version__)'
          echo "Container status:"
          docker ps --filter name=gap-jupyter
          echo "Jupyter kernels:"
          docker exec gap-jupyter jupyter kernelspec list || true
          echo "GAP executable:"
          docker exec gap-jupyter sh -lc 'command -v gap; command -v jupyter-kernel-gap; echo JUPYTER_GAP_EXECUTABLE=$JUPYTER_GAP_EXECUTABLE; command -v save-to-github'
          echo "GAP package check:"
          docker exec gap-jupyter gap -q -c 'Print(LoadPackage("JupyterKernel"),"\n"); QUIT;'
          echo "PO token provider log:"
          docker exec gap-jupyter sh -lc 'tail -50 /workspace/bgutil.log 2>/dev/null || true'
          echo "YouTube backend health:"
          curl -fsS http://127.0.0.1:8765/health
          echo
          echo "Telegram bot log:"
          docker exec gap-jupyter sh -lc 'cat /workspace/bot.log 2>/dev/null || true'

      - name: Test GAP kernel end-to-end
        run: |
          docker exec -i gap-jupyter python3 - <<'PY'
          from jupyter_client import KernelManager
          km = KernelManager(kernel_name="gap-4")
          km.start_kernel(cwd="/workspace")
          kc = km.client()
          kc.start_channels()
          try:
              kc.wait_for_ready(timeout=30)
              msg_id = kc.execute("2+2;")
              got_result = False
              while True:
                  msg = kc.get_iopub_msg(timeout=30)
                  if msg["parent_header"].get("msg_id") != msg_id: continue
                  typ = msg["msg_type"]
                  content = msg["content"]
                  if typ == "execute_result":
                      print("GAP EXECUTE_RESULT:", content["data"]); got_result = True
                  elif typ == "stream": print("GAP STREAM:", content["text"], end="")
                  elif typ == "error": raise SystemExit(1)
                  elif typ == "status" and content["execution_state"] == "idle": break
              if not got_result: raise RuntimeError("GAP kernel reached idle without an execute_result")
              print("GAP KERNEL TEST: OK")
          finally:
              kc.stop_channels(); km.shutdown_kernel(now=True)
          PY

      - name: Install cloudflared
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Cloudflare tunnels
        env:
          JUPYTER_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-gap
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nohup ./cloudflared tunnel --url http://127.0.0.1:8888 > tunnel.log 2>&1 &
          JUPYTER_TUNNEL_PID=$!
          JUPYTER_URL=""
          for i in {1..60}; do
            JUPYTER_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            [ -n "$JUPYTER_URL" ] && break
            sleep 2
          done
          test -n "$JUPYTER_URL"

          nohup ./cloudflared tunnel --url http://127.0.0.1:8765 > youtube-tunnel.log 2>&1 &
          YOUTUBE_TUNNEL_PID=$!
          YOUTUBE_URL=""
          for i in {1..60}; do
            YOUTUBE_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' youtube-tunnel.log | head -1 || true)
            [ -n "$YOUTUBE_URL" ] && break
            sleep 2
          done
          test -n "$YOUTUBE_URL"

          echo "YouTube backend: $YOUTUBE_URL"
          for i in {1..30}; do
            PUBLIC_HEALTH=$(curl -fsS --max-time 10 "$YOUTUBE_URL/health" 2>/dev/null || true)
            if echo "$PUBLIC_HEALTH" | grep -q 'youtube-backend'; then echo "Public YouTube backend is reachable: $PUBLIC_HEALTH"; break; fi
            [ "$i" -eq 30 ] && { cat youtube-tunnel.log || true; exit 1; }
            sleep 2
          done

          CONFIG_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/youtube-player/backend-url.json"
          CURRENT_SHA=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$CONFIG_URL" | jq -r '.sha')
          CONTENT=$(printf '{\n  "apiBase": "%s"\n}\n' "$YOUTUBE_URL" | base64 -w 0)
          PAYLOAD=$(jq -n --arg message "Update live YouTube backend URL" --arg content "$CONTENT" --arg sha "$CURRENT_SHA" '{message:$message,content:$content,sha:$sha,branch:"main"}')
          curl -fsSL -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$CONFIG_URL" --data "$PAYLOAD" >/tmp/backend-url-update.json
          echo "Backend URL published."
          echo "JUPYTER_URL: ${JUPYTER_URL}/lab?token=${JUPYTER_TOKEN}"
          echo "YOUTUBE_BACKEND_URL: ${YOUTUBE_URL}"
          echo "JUPYTER_TUNNEL_PID=$JUPYTER_TUNNEL_PID" >> "$GITHUB_ENV"
          echo "YOUTUBE_TUNNEL_PID=$YOUTUBE_TUNNEL_PID" >> "$GITHUB_ENV"

      - name: Queue next restart in 5 hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nohup bash -c 'sleep 18000; curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gap-jupyter.yml/dispatches" -d "{\"ref\":\"main\"}"' >/tmp/next-restart.log 2>&1 &
          echo "Next GAP run will be dispatched in 5 hours."

      - name: Keep Jupyter, Telegram bot and YouTube backend alive
        run: |
          while kill -0 "$JUPYTER_TUNNEL_PID" 2>/dev/null && kill -0 "$YOUTUBE_TUNNEL_PID" 2>/dev/null; do
            docker ps --format '{{.Names}}' | grep -qx 'gap-jupyter' || exit 1
            sleep 30
          done
          cat tunnel.log || true
          cat youtube-tunnel.log || true
          docker logs gap-jupyter || true
          exit 1
