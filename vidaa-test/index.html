<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VIDAA Remote Key Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>VIDAA ПУЛЬТ — ДІАГНОСТИКА</h1>
    <div id="lastKey">Натисни будь-яку кнопку пульта</div>
    <div id="history">Очікую подію…</div>
    <div class="grid">
      <button tabindex="0" data-name="LEFT">← LEFT</button>
      <button tabindex="0" data-name="UP">↑ UP</button>
      <button tabindex="0" data-name="RIGHT">→ RIGHT</button>
      <button tabindex="0" data-name="DOWN">↓ DOWN</button>
      <button tabindex="0" data-name="OK">OK / ENTER</button>
      <button tabindex="0" data-name="BACK">BACK / RETURN</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
