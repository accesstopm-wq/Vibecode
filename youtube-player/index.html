<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VIDAA YouTube Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.player{position:relative;width:100vw;height:100vh;background:#000}.video{width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;left:0;right:0;bottom:0;padding:18px 28px 24px;background:linear-gradient(transparent,rgba(0,0,0,.9));opacity:0;transition:opacity .12s}.overlay.visible{opacity:1}.controls{display:flex;align-items:center;gap:12px}.btn{border:2px solid transparent;background:rgba(30,30,30,.9);color:#fff;border-radius:6px;min-width:88px;height:54px;font-size:24px;padding:0 16px}.btn.focus{border-color:#fff;background:#333}.seekbar{height:12px;background:#555;border-radius:8px;margin:0 0 14px;position:relative;outline:3px solid transparent}.seekbar.focus{outline-color:#fff}.seekfill{height:100%;width:0;background:#fff;border-radius:8px}.time{font-size:18px;min-width:150px}.status{position:absolute;top:24px;left:28px;font-size:18px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:5px}.status.hide{display:none}.error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:40px;box-sizing:border-box}.hidden{display:none!important}
</style>
</head>
<body>
<div class="player" id="player">
<video id="video" class="video" playsinline preload="auto"></video>
<div id="error" class="error hidden"></div>
<div id="status" class="status">Loading…</div>
<div id="overlay" class="overlay">
<div id="seekbar" class="seekbar"><div id="seekfill" class="seekfill"></div></div>
<div class="controls"><button class="btn" id="back10">↶ 10</button><button class="btn focus" id="play">▶ / ❚❚</button><button class="btn" id="forward10">10 ↷</button><span class="time" id="time">0:00 / 0:00</span></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.2/dist/hls.light.min.js"></script>
<script>
(function(){
'use strict';
var video=document.getElementById('video'),overlay=document.getElementById('overlay'),seekbar=document.getElementById('seekbar'),seekfill=document.getElementById('seekfill'),play=document.getElementById('play'),back10=document.getElementById('back10'),forward10=document.getElementById('forward10'),timeEl=document.getElementById('time'),statusEl=document.getElementById('status'),errorEl=document.getElementById('error');
var HLS=null,apiBase='',sourceUrl='',videoId='',streamStart=0,streamGeneration=0,totalDuration=0,focusIndex=1,overlayTimer=0,pendingTarget=null,seekTimer=0,loading=false,lastSave=0,storagePrefix='vidaa-yt-progress:';
var controls=[back10,play,forward10,seekbar];
function param(name){var q=location.search.substring(1).split('&'),i,p,k;for(i=0;i<q.length;i++){p=q[i].split('=');k=decodeURIComponent(p[0]||'');if(k===name)return decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '));}return '';}
function parseYoutube(v){var m;if(!v)return '';v=v.trim();m=v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);if(m)return m[1];if(/^[A-Za-z0-9_-]{11}$/.test(v))return v;return '';}
function fmt(s){var h,m,x;if(!isFinite(s))s=0;s=Math.max(0,Math.floor(s));h=Math.floor(s/3600);m=Math.floor((s%3600)/60);x=s%60;return(h?h+':':'')+(h?(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x;}
function showOverlay(){overlay.className='overlay visible';if(overlayTimer)clearTimeout(overlayTimer);overlayTimer=setTimeout(function(){if(!video.paused)overlay.className='overlay';},3500);}
function setFocus(i){var j;focusIndex=i;for(j=0;j<controls.length;j++)controls[j].className=controls[j].className.replace(/\s?focus/g,'');controls[focusIndex].className+=' focus';showOverlay();}
function getSaved(){var x=parseFloat(localStorage.getItem(storagePrefix+videoId));return isFinite(x)?x:0;}
function globalTime(){return Math.max(0,streamStart+(isFinite(video.currentTime)?video.currentTime:0));}
function save(){var t=globalTime();if(!videoId||!isFinite(t)||t<1)return;if(Date.now()-lastSave<1000)return;localStorage.setItem(storagePrefix+videoId,String(t));lastSave=Date.now();}
function setStatus(s){statusEl.innerHTML=s;statusEl.className='status';}
function hideStatus(){statusEl.className='status hide';}
function fail(s){loading=false;errorEl.innerHTML=s;errorEl.className='error';statusEl.className='status hide';}
function requestJson(url,ok,bad){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText));}catch(e){bad(new Error('Invalid JSON'));}}else bad(new Error('HTTP '+x.status));};x.onerror=function(){bad(new Error('Network error'));};x.send();}
function loadConfig(){requestJson('backend-url.json?ts='+Date.now(),function(c){apiBase=(c&&c.apiBase)||c&&c.url||'';if(!apiBase){fail('Backend URL is missing.');return;}openStream(0,true);},function(){fail('Cannot load backend configuration.');});}
function destroyHls(){if(HLS){try{HLS.destroy();}catch(e){}HLS=null;}}
function attachNative(url,start,autoplay){destroyHls();streamStart=start;loading=true;video.onloadedmetadata=function(){loading=false;hideStatus();if(totalDuration<=0&&isFinite(video.duration))totalDuration=streamStart+video.duration;var saved=getSaved();if(start===0&&saved>5&&(totalDuration<=0||saved<totalDuration-5)){try{video.currentTime=saved;}catch(e){}}if(autoplay!==false){var p=video.play();if(p&&p.catch)p.catch(function(){});}update();};video.src=url;video.load();}
function attachHls(url,start,autoplay){destroyHls();streamStart=start;loading=true;HLS=new Hls({debug:false,maxBufferLength:30,backBufferLength:60,maxMaxBufferLength:120,liveSyncDurationCount:3,liveMaxLatencyDurationCount:8,enableWorker:true});HLS.on(Hls.Events.MANIFEST_PARSED,function(){hideStatus();loading=false;if(start===0){var saved=getSaved();if(saved>5&&(totalDuration<=0||saved<totalDuration-5))setTimeout(function(){seekAbsolute(saved,false);},50);}if(autoplay!==false){var p=video.play();if(p&&p.catch)p.catch(function(){});}showOverlay();update();});HLS.on(Hls.Events.LEVEL_LOADED,function(e,d){if(d&&d.details&&isFinite(d.details.totalduration)&&d.details.live===false)totalDuration=Math.max(totalDuration,streamStart+d.details.totalduration);});HLS.on(Hls.Events.ERROR,function(e,d){if(!d||!d.fatal)return;if(d.type===Hls.ErrorTypes.NETWORK_ERROR){setStatus('Reconnecting…');try{HLS.startLoad();}catch(x){}}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){try{HLS.recoverMediaError();}catch(x){fail('Media playback error.');}}else fail('HLS playback error.');});video.onloadedmetadata=function(){update();};HLS.loadSource(url);HLS.attachMedia(video);}
function openStream(start,autoplay){if(loading){pendingTarget=start;return;}loading=true;setStatus(start>0?'Seeking to '+fmt(start)+'…':'Loading video…');var url=apiBase.replace(/\/$/,'')+'/api/stream?url='+encodeURIComponent(sourceUrl)+'&start='+encodeURIComponent(String(Math.max(0,Math.floor(start))));requestJson(url,function(data){if(!data||!data.url){loading=false;fail((data&&data.error)||'Backend did not return a stream.');return;}streamStart=Number(data.start||0);streamGeneration=Number(data.generation||0);if(data.duration&&isFinite(Number(data.duration)))totalDuration=Number(data.duration);errorEl.className='error hidden';if(window.Hls&&Hls.isSupported())attachHls(data.url,streamStart,autoplay);else if(video.canPlayType('application/vnd.apple.mpegurl'))attachNative(data.url,streamStart,autoplay);else{loading=false;fail('This VIDAA browser does not support HLS playback.');}},function(){loading=false;fail('Backend network error.');});}
function seekableGlobal(){var i;try{if(video.seekable&&video.seekable.length){i=video.seekable.length-1;return{start:streamStart+video.seekable.start(i),end:streamStart+video.seekable.end(i)};}}catch(e){}return null;}
function seekAbsolute(target,show){target=Math.max(0,target);if(totalDuration>0)target=Math.min(target,totalDuration);var r=seekableGlobal();if(r&&target>=r.start-2&&target<=r.end+2){try{video.currentTime=Math.max(0,target-streamStart);}catch(e){}if(show!==false)showOverlay();save();return;}pendingTarget=target;if(seekTimer)clearTimeout(seekTimer);seekTimer=setTimeout(function(){var t=pendingTarget;pendingTarget=null;openStream(t,true);},120);setStatus('Seeking to '+fmt(target)+'…');}
function seekRelative(delta){seekAbsolute(Math.max(0,globalTime()+delta),true);}
function toggle(){if(video.paused){var p=video.play();if(p&&p.catch)p.catch(function(){});}else video.pause();showOverlay();}
function update(){var t=globalTime(),percent=totalDuration?(t/totalDuration*100):0;if(percent<0)percent=0;if(percent>100)percent=100;seekfill.style.width=percent+'%';timeEl.innerHTML=fmt(t)+' / '+fmt(totalDuration);if(t>0)save();}
function key(e){var k=e.keyCode||e.which;if([37,38,39,40,13,32,27,48,50,52,53,54,56].indexOf(k)>=0)e.preventDefault();if(k===27){save();return;}if(k===52||k===37){if(focusIndex===3)seekRelative(-10);else if(focusIndex===2)setFocus(1);else if(focusIndex===1)setFocus(0);return;}if(k===54||k===39){if(focusIndex===3)seekRelative(10);else if(focusIndex===0)setFocus(1);else if(focusIndex===1)setFocus(2);return;}if(k===50||k===38){if(focusIndex===3)setFocus(1);else setFocus(3);return;}if(k===56||k===40){if(focusIndex===3)setFocus(1);else setFocus(3);return;}if(k===53||k===13||k===32){if(overlay.className.indexOf('visible')<0){setFocus(1);toggle();return;}if(focusIndex===0)seekRelative(-10);else if(focusIndex===1)toggle();else if(focusIndex===2)seekRelative(10);else{showOverlay();setFocus(3);}return;}if(k===48){if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}}
seekbar.onclick=function(e){var r=seekbar.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;seekAbsolute((totalDuration||0)*x,true);setFocus(3);};
play.onclick=function(){setFocus(1);toggle();};back10.onclick=function(){setFocus(0);seekRelative(-10);};forward10.onclick=function(){setFocus(2);seekRelative(10);};
video.addEventListener('timeupdate',update,false);video.addEventListener('play',showOverlay,false);video.addEventListener('pause',showOverlay,false);video.addEventListener('ended',function(){if(videoId)localStorage.removeItem(storagePrefix+videoId);},false);video.addEventListener('error',function(){if(!loading)fail('VIDAA could not play the HLS stream.');},false);document.addEventListener('keydown',key,false);document.addEventListener('visibilitychange',save,false);window.addEventListener('pagehide',save,false);window.addEventListener('beforeunload',save,false);
sourceUrl=param('url');videoId=parseYoutube(sourceUrl);if(!sourceUrl||!videoId){fail('Open the player with ?url=YouTube_URL');return;}loadConfig();
})();
</script>
</body>
</html>
