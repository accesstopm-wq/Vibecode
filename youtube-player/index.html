<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VIDAA YouTube Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.player{position:relative;width:100vw;height:100vh;background:#000}.video{width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;left:0;right:0;bottom:0;padding:18px 28px 24px;background:linear-gradient(transparent,rgba(0,0,0,.9));opacity:0}.overlay.visible{opacity:1}.controls{display:flex;align-items:center;gap:12px}.btn{border:2px solid transparent;background:rgba(30,30,30,.9);color:#fff;border-radius:6px;min-width:88px;height:54px;font-size:24px;padding:0 16px}.btn.focus{border-color:#fff;background:#333}.seekbar{height:12px;background:#555;border-radius:8px;margin:0 0 14px;position:relative;outline:3px solid transparent}.seekbar.focus{outline-color:#fff}.seekfill{height:100%;width:0;background:#fff;border-radius:8px}.time{font-size:18px;min-width:150px}.status{position:absolute;top:24px;left:28px;font-size:18px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:5px}.status.hide{display:none}.error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:40px;box-sizing:border-box}.hidden{display:none!important}
</style>
</head>
<body>
<div class="player" id="player">
<video id="video" class="video" playsinline preload="metadata"></video>
<div id="error" class="error hidden"></div>
<div id="status" class="status">Loading…</div>
<div id="overlay" class="overlay">
<div id="seekbar" class="seekbar"><div id="seekfill" class="seekfill"></div></div>
<div class="controls"><button class="btn" id="back10">↶ 10</button><button class="btn focus" id="play">▶ / ❚❚</button><button class="btn" id="forward10">10 ↷</button><span class="time" id="time">0:00 / 0:00</span></div>
</div>
</div>
<script>
(function(){
'use strict';
var video=document.getElementById('video'),overlay=document.getElementById('overlay'),seekbar=document.getElementById('seekbar'),seekfill=document.getElementById('seekfill'),play=document.getElementById('play'),back10=document.getElementById('back10'),forward10=document.getElementById('forward10'),timeEl=document.getElementById('time'),errorEl=document.getElementById('error'),statusEl=document.getElementById('status');
var controls=[back10,play,forward10,seekbar],focusIndex=1,overlayTimer=0,videoId='',sourceUrl='',storageKey='vidaa-yt-progress:',lastSaved=0,apiBase='',streamRetry=0,jsonpSeq=0,totalDuration=0,sessionStart=0,loadingSeek=false,streamBusy=false,pendingSeek=null;
function param(name){var q=location.search.substring(1).split('&'),i,p,k;for(i=0;i<q.length;i++){p=q[i].split('=');k=decodeURIComponent(p[0]||'');if(k===name)return decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '));}return '';}
function parseYoutube(v){var m;if(!v)return '';v=v.trim();m=v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);if(m)return m[1];if(/^[A-Za-z0-9_-]{11}$/.test(v))return v;return '';}
function fmt(s){var h,m,x;if(!isFinite(s))s=0;s=Math.max(0,Math.floor(s));h=Math.floor(s/3600);m=Math.floor((s%3600)/60);x=s%60;return(h?h+':':'')+(h?(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x;}
function showOverlay(){overlay.className='overlay visible';if(overlayTimer)clearTimeout(overlayTimer);overlayTimer=setTimeout(function(){if(!video.paused)overlay.className='overlay';},3500);}
function setFocus(i){var j;focusIndex=i;for(j=0;j<controls.length;j++)controls[j].className=controls[j].className.replace(/\s?focus/g,'');controls[focusIndex].className+=' focus';showOverlay();}
function actualTime(){if(pendingSeek!==null)return pendingSeek;return sessionStart+(isFinite(video.currentTime)?video.currentTime:0);}
function finishStreamLoad(){streamBusy=false;if(pendingSeek!==null){var next=pendingSeek;pendingSeek=null;loadStream(next,true);}}
function loadStream(start,autoplay){streamBusy=true;var endpoint=apiBase.replace(/\/$/,'')+'/api/stream?url='+encodeURIComponent(sourceUrl)+'&start='+encodeURIComponent(String(Math.max(0,Math.floor(start||0))));statusEl.innerHTML=start>0?'Seeking to '+fmt(start)+'…':'Loading video…';statusEl.className='status';requestStreamJsonp(endpoint,function(data){if(!data||!data.url){streamBusy=false;fail((data&&data.error)||'Backend не повернув відеопотік.');return;}if(data.videoId)videoId=data.videoId;if(data.duration&&isFinite(Number(data.duration)))totalDuration=Number(data.duration);sessionStart=Number(data.start||0);loadingSeek=true;video.onloadedmetadata=function(){statusEl.className='status hide';var local=0;if(start>0)local=0;else{var saved=parseFloat(localStorage.getItem(storageKey+videoId));if(saved>5&&saved<totalDuration-5){local=saved;sessionStart=0;}}try{video.currentTime=local;}catch(e){}loadingSeek=false;update();showOverlay();setFocus(1);if(autoplay!==false){var p=video.play();if(p&&p.catch)p.catch(function(){});}finishStreamLoad();};video.onerror=function(){streamBusy=false;fail('VIDAA не зміг відкрити отриманий відеопотік.');};video.src=data.url;video.load();},function(err){streamBusy=false;if(streamRetry<1){streamRetry++;statusEl.innerHTML='Reconnecting…';loadConfig();return;}fail('YouTube backend error: '+(err&&err.message?err.message:'network error'));});}
function seek(d){var base=pendingSeek!==null?pendingSeek:actualTime(),target=Math.max(0,Math.min(totalDuration||999999,base+d));if(streamBusy){pendingSeek=target;statusEl.innerHTML='Seeking to '+fmt(target)+'…';statusEl.className='status';return;}if(target<sessionStart||target>sessionStart+(isFinite(video.duration)?video.duration-8:0)){pendingSeek=null;loadStream(target,true);}else{try{video.currentTime=target-sessionStart;}catch(e){}showOverlay();save();}}
function seekAbsolute(target){target=Math.max(0,Math.min(totalDuration||999999,target));if(streamBusy){pendingSeek=target;statusEl.innerHTML='Seeking to '+fmt(target)+'…';statusEl.className='status';return;}if(target<sessionStart||target>sessionStart+(isFinite(video.duration)?video.duration-8:0)){pendingSeek=null;loadStream(target,true);}else{try{video.currentTime=target-sessionStart;}catch(e){}showOverlay();save();}}
function toggle(){if(video.paused){var p=video.play();if(p&&p.catch)p.catch(function(){});}else video.pause();showOverlay();}
function save(){var now=Date.now();var t=actualTime();if(videoId&&isFinite(t)&&t>0&&now-lastSaved>1000){localStorage.setItem(storageKey+videoId,String(t));lastSaved=now;}}
function update(){var t=actualTime();var p=totalDuration?(t/totalDuration*100):(video.duration?(video.currentTime/video.duration*100):0);if(p<0)p=0;if(p>100)p=100;seekfill.style.width=p+'%';timeEl.innerHTML=fmt(t)+' / '+fmt(totalDuration||video.duration);if(Math.abs(t-(parseFloat(localStorage.getItem(storageKey+videoId))||0))>5)save();}
function fail(message){streamBusy=false;pendingSeek=null;statusEl.className='status hide';errorEl.innerHTML=message||'Не вдалося отримати відеопотік. Спробуй повторити пізніше.';errorEl.className='error';}
function requestJson(url,ok,bad){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText));}catch(e){bad(new Error('Invalid JSON'));}}else{var msg='HTTP '+x.status;try{var d=JSON.parse(x.responseText);if(d&&d.error)msg+=': '+d.error;}catch(e){}bad(new Error(msg));}};x.onerror=function(){bad(new Error('Network error'));};x.send();}
function requestStreamJsonp(url,ok,bad){var callback='__vidaaYtCb'+(++jsonpSeq),script=document.createElement('script'),done=false,timer=0;window[callback]=function(data){if(done)return;done=true;clearTimeout(timer);try{if(data&&data.error)bad(new Error(data.error));else ok(data);}finally{try{delete window[callback];}catch(e){window[callback]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);}};script.onerror=function(){if(done)return;done=true;clearTimeout(timer);try{delete window[callback];}catch(e){window[callback]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);bad(new Error('Backend network error'));};script.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+encodeURIComponent(callback)+'&ts='+Date.now();document.getElementsByTagName('head')[0].appendChild(script);timer=setTimeout(function(){if(done)return;done=true;try{delete window[callback];}catch(e){}if(script.parentNode)script.parentNode.removeChild(script);bad(new Error('Backend timeout'));},180000);}
function configUrl(){return 'backend-url.json?ts='+Date.now();}
function rawConfigUrl(){return 'https://raw.githubusercontent.com/accesstopm-wq/Vibecode/main/youtube-player/backend-url.json?ts='+Date.now();}
function loadConfig(){requestJson(configUrl(),function(cfg){apiBase=(cfg&&cfg.apiBase)||cfg&&cfg.url||'';if(!apiBase){fail('YouTube backend зараз не запущений.');return;}loadStream(0,true);},function(){requestJson(rawConfigUrl(),function(cfg){apiBase=(cfg&&cfg.apiBase)||cfg&&cfg.url||'';if(!apiBase){fail('YouTube backend зараз не запущений.');return;}loadStream(0,true);},function(){fail('Не вдалося завантажити конфігурацію YouTube backend.');});});}
function key(e){var k=e.keyCode||e.which;if([37,38,39,40,13,32,27,48,50,52,53,54,56].indexOf(k)>=0)e.preventDefault();if(k===27){save();return;}if(k===52||k===37){if(focusIndex===3)seek(-10);else if(focusIndex===2)setFocus(1);else if(focusIndex===1)setFocus(0);return;}if(k===54||k===39){if(focusIndex===3)seek(10);else if(focusIndex===0)setFocus(1);else if(focusIndex===1)setFocus(2);return;}if(k===50||k===38){if(focusIndex===3)setFocus(1);else setFocus(3);return;}if(k===56||k===40){if(focusIndex===3)setFocus(1);else setFocus(3);return;}if(k===53||k===13||k===32){if(overlay.className.indexOf('visible')<0){setFocus(1);toggle();return;}if(focusIndex===0)seek(-10);else if(focusIndex===1)toggle();else if(focusIndex===2)seek(10);else {showOverlay();setFocus(3);}return;}if(k===48){if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}}
video.addEventListener('timeupdate',update,false);video.addEventListener('play',showOverlay,false);video.addEventListener('pause',showOverlay,false);video.addEventListener('click',toggle,false);video.addEventListener('ended',function(){if(videoId)localStorage.removeItem(storageKey+videoId);},false);video.addEventListener('error',function(){if(!loadingSeek)fail('VIDAA не зміг відкрити HLS-потік.');},false);document.addEventListener('keydown',key,false);document.addEventListener('visibilitychange',save,false);window.addEventListener('pagehide',save,false);window.addEventListener('beforeunload',save,false);play.onclick=function(){setFocus(1);toggle();};back10.onclick=function(){setFocus(0);seek(-10);};forward10.onclick=function(){setFocus(2);seek(10);};seekbar.onclick=function(e){var r=seekbar.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;seekAbsolute((totalDuration||video.duration||0)*x);setFocus(3);};sourceUrl=param('url');videoId=parseYoutube(sourceUrl);if(!sourceUrl){fail('Відкрий сторінку з параметром ?url=YouTube_URL');return;}loadConfig();
})();
</script>
</body>
</html>
