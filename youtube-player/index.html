<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VIDAA YouTube Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.player{position:relative;width:100vw;height:100vh;background:#000}.video{width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;left:0;right:0;bottom:0;padding:18px 28px 24px;background:linear-gradient(transparent,rgba(0,0,0,.9));opacity:0;transition:opacity .15s}.overlay.visible{opacity:1}.controls{display:flex;align-items:center;gap:12px}.btn{border:2px solid transparent;background:rgba(30,30,30,.9);color:#fff;border-radius:6px;min-width:88px;height:54px;font-size:24px;padding:0 16px}.btn.focus{border-color:#fff;background:#333}.seekbar{height:12px;background:#555;border-radius:8px;margin:0 0 14px;position:relative;outline:3px solid transparent}.seekbar.focus{outline-color:#fff}.seekfill{height:100%;width:0;background:#fff;border-radius:8px}.time{font-size:18px;min-width:125px}.status{position:absolute;top:24px;left:28px;font-size:18px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:5px;opacity:0}.status.show{opacity:1}.error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:40px;box-sizing:border-box}.hidden{display:none!important}
</style>
</head>
<body>
<div class="player" id="player">
  <video id="video" class="video" playsinline preload="metadata"></video>
  <div id="error" class="error hidden"></div>
  <div id="status" class="status"></div>
  <div id="overlay" class="overlay">
    <div id="seekbar" class="seekbar" tabindex="0"><div id="seekfill" class="seekfill"></div></div>
    <div class="controls">
      <button class="btn" id="back10">↶ 10</button>
      <button class="btn focus" id="play">▶ / ❚❚</button>
      <button class="btn" id="forward10">10 ↷</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var video=document.getElementById('video'), overlay=document.getElementById('overlay'), seekbar=document.getElementById('seekbar'), seekfill=document.getElementById('seekfill'), play=document.getElementById('play'), back10=document.getElementById('back10'), forward10=document.getElementById('forward10'), timeEl=document.getElementById('time'), errorEl=document.getElementById('error'), statusEl=document.getElementById('status');
  var buttons=[back10,play,forward10,seekbar], focusIndex=1, overlayTimer=null, videoId='', storageKey='vidaa-yt-progress:';
  var instances=['https://pipedapi.kavin.rocks','https://pipedapi.tokhmi.xyz','https://pipedapi.moomoo.me','https://pipedapi.syncpundit.io','https://api-piped.mha.fi'];

  function param(name){var q=location.search.substring(1).split('&'),i,p;for(i=0;i<q.length;i++){p=q[i].split('=');if(decodeURIComponent(p[0]||'')===name)return decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '));}return ''}
  function parseYoutube(value){
    if(!value)return '';
    value=value.trim();
    var m=value.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
    if(m)return m[1];
    if(/^[A-Za-z0-9_-]{11}$/.test(value))return value;
    return '';
  }
  function fmt(s){if(!isFinite(s))s=0;s=Math.max(0,Math.floor(s));var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return (h?h+':':'')+(h?(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x}
  function showOverlay(){overlay.className='overlay visible';clearTimeout(overlayTimer);overlayTimer=setTimeout(function(){if(!video.paused)overlay.className='overlay';},3500)}
  function setFocus(i){focusIndex=(i+buttons.length)%buttons.length;for(var j=0;j<buttons.length;j++)buttons[j].className=buttons[j].className.replace(/\s?focus/g,'');buttons[focusIndex].className+=' focus';showOverlay()}
  function seek(delta){if(isFinite(video.duration))video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+delta));showOverlay()}
  function toggle(){if(video.paused)video.play();else video.pause();showOverlay()}
  function save(){if(videoId&&isFinite(video.currentTime)&&video.currentTime>0)localStorage.setItem(storageKey+videoId,String(video.currentTime));}
  function update(){var p=video.duration?(video.currentTime/video.duration*100):0;seekfill.style.width=p+'%';timeEl.innerHTML=fmt(video.currentTime)+' / '+fmt(video.duration)}
  function fail(msg){errorEl.innerHTML=msg;errorEl.className='error';}
  function xhr(url,ok,bad){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){bad(e)}}else bad(new Error('HTTP '+x.status))}};x.onerror=function(){bad(new Error('Network error'))};x.send()}
  function chooseStream(data){
    var list=data.videoStreams||[], best=null, i;
    for(i=0;i<list.length;i++){var s=list[i];if(s.videoOnly===false&&/^video\/mp4/.test(s.mimeType||'')&&s.url){if(!best||Math.abs((s.height||0)-720)<Math.abs((best.height||0)-720))best=s}}
    if(!best){for(i=0;i<list.length;i++){if(list[i].url&&!list[i].videoOnly){best=list[i];break}}}
    return best;
  }
  function loadFromInstance(idx){
    if(idx>=instances.length){fail('Не вдалося отримати відеопотік. Piped-інстанси зараз недоступні або YouTube змінив API.');return}
    var base=instances[idx];statusEl.innerHTML='Loading…';statusEl.className='status show';
    xhr(base+'/streams/'+videoId,function(data){var stream=chooseStream(data);if(!stream){loadFromInstance(idx+1);return}video.src=stream.url;video.load();video.addEventListener('loadedmetadata',function(){
      var saved=parseFloat(localStorage.getItem(storageKey+videoId));
      if(saved>5&&saved<video.duration-5)video.currentTime=saved;
      video.play().catch(function(){});showOverlay();statusEl.className='status';
    },{once:true});video.addEventListener('error',function(){if(idx+1<instances.length&&!video.dataset.retried){video.dataset.retried='1';loadFromInstance(idx+1)}},{once:true});},function(){loadFromInstance(idx+1)});
  }
  function key(e){
    var k=e.keyCode||e.which;
    if([37,38,39,40,13,32,27,50,52,53,54,56,48].indexOf(k)>=0)e.preventDefault();
    if(k===27){save();return}
    if(k===50){seek(-10);return} // 2 = up/back 10
    if(k===56){seek(10);return}  // 8 = down/forward 10
    if(k===52){if(focusIndex===1)setFocus(0);else if(focusIndex===3)seek(-10);else setFocus(focusIndex-1);return}
    if(k===54){if(focusIndex===1)setFocus(2);else if(focusIndex===3)seek(10);else setFocus(focusIndex+1);return}
    if(k===53){if(focusIndex===0)seek(-10);else if(focusIndex===1)toggle();else if(focusIndex===2)seek(10);else if(focusIndex===3){var r=seekbar.getBoundingClientRect();var x=Math.max(0,Math.min(1,(window.event&&window.event.clientX-r.left)/r.width));if(isFinite(video.duration))video.currentTime=x*video.duration;}showOverlay();return}
    if(k===32||k===13){toggle();return}
    if(k===37){if(focusIndex===3)seek(-10);else setFocus(focusIndex-1);return}
    if(k===39){if(focusIndex===3)seek(10);else setFocus(focusIndex+1);return}
    if(k===38){setFocus(focusIndex===3?1:focusIndex-1);return}
    if(k===40){setFocus(focusIndex===1?3:focusIndex+1);return}
    if(k===48){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}
  }
  video.addEventListener('timeupdate',update);video.addEventListener('play',showOverlay);video.addEventListener('pause',showOverlay);video.addEventListener('click',toggle);document.addEventListener('keydown',key,false);document.addEventListener('visibilitychange',save);window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);play.onclick=toggle;back10.onclick=function(){seek(-10)};forward10.onclick=function(){seek(10)};seekbar.onclick=function(e){var r=seekbar.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(isFinite(video.duration))video.currentTime=Math.max(0,Math.min(1,x))*video.duration;setFocus(3)};
  video.addEventListener('ended',function(){save();localStorage.removeItem(storageKey+videoId)});
  videoId=parseYoutube(param('url')||param('v'));
  if(!videoId){fail('Відкрий сторінку з параметром ?url=YouTube_URL');return}
  loadFromInstance(0);
})();
</script>
</body>
</html>
