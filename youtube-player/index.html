<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VIDAA YouTube Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.player{position:relative;width:100vw;height:100vh;background:#000}.video{width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;left:0;right:0;bottom:0;padding:18px 28px 24px;background:linear-gradient(transparent,rgba(0,0,0,.9));opacity:0}.overlay.visible{opacity:1}.controls{display:flex;align-items:center;gap:12px}.btn{border:2px solid transparent;background:rgba(30,30,30,.9);color:#fff;border-radius:6px;min-width:88px;height:54px;font-size:24px;padding:0 16px}.btn.focus{border-color:#fff;background:#333}.seekbar{height:12px;background:#555;border-radius:8px;margin:0 0 14px;position:relative;outline:3px solid transparent}.seekbar.focus{outline-color:#fff}.seekfill{height:100%;width:0;background:#fff;border-radius:8px}.time{font-size:18px;min-width:125px}.status{position:absolute;top:24px;left:28px;font-size:18px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:5px}.status.hide{display:none}.error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:40px;box-sizing:border-box}.hidden{display:none!important}
</style>
</head>
<body>
<div class="player" id="player">
<video id="video" class="video" playsinline preload="metadata"></video>
<div id="error" class="error hidden"></div>
<div id="status" class="status">Loading…</div>
<div id="overlay" class="overlay">
<div id="seekbar" class="seekbar"><div id="seekfill" class="seekfill"></div></div>
<div class="controls"><button class="btn" id="back10">↶ 10</button><button class="btn focus" id="play">▶ / ❚❚</button><button class="btn" id="forward10">10 ↷</button><span class="time" id="time">0:00 / 0:00</span></div>
</div>
</div>
<script>
(function(){
'use strict';
var video=document.getElementById('video'),overlay=document.getElementById('overlay'),seekbar=document.getElementById('seekbar'),seekfill=document.getElementById('seekfill'),play=document.getElementById('play'),back10=document.getElementById('back10'),forward10=document.getElementById('forward10'),timeEl=document.getElementById('time'),errorEl=document.getElementById('error'),statusEl=document.getElementById('status');
var controls=[back10,play,forward10,seekbar],focusIndex=1,overlayTimer=0,videoId='',storageKey='vidaa-yt-progress:',lastSaved=0,apiBase='';
function param(name){var q=location.search.substring(1).split('&'),i,p,k;for(i=0;i<q.length;i++){p=q[i].split('=');k=decodeURIComponent(p[0]||'');if(k===name)return decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '));}return '';}
function parseYoutube(v){var m;if(!v)return '';v=v.trim();m=v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);if(m)return m[1];if(/^[A-Za-z0-9_-]{11}$/.test(v))return v;return '';}
function fmt(s){var h,m,x;if(!isFinite(s))s=0;s=Math.max(0,Math.floor(s));h=Math.floor(s/3600);m=Math.floor((s%3600)/60);x=s%60;return(h?h+':':'')+(h?(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x;}
function showOverlay(){overlay.className='overlay visible';if(overlayTimer)clearTimeout(overlayTimer);overlayTimer=setTimeout(function(){if(!video.paused)overlay.className='overlay';},3500);}
function setFocus(i){var j;focusIndex=(i+controls.length)%controls.length;for(j=0;j<controls.length;j++)controls[j].className=controls[j].className.replace(/\s?focus/g,'');controls[focusIndex].className+=' focus';showOverlay();}
function seek(d){if(isFinite(video.duration))video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+d));showOverlay();save();}
function toggle(){if(video.paused){var p=video.play();if(p&&p.catch)p.catch(function(){});}else video.pause();showOverlay();}
function save(){var now=Date.now();if(videoId&&isFinite(video.currentTime)&&video.currentTime>0&&now-lastSaved>1000){localStorage.setItem(storageKey+videoId,String(video.currentTime));lastSaved=now;}}
function update(){var p=video.duration?(video.currentTime/video.duration*100):0;seekfill.style.width=p+'%';timeEl.innerHTML=fmt(video.currentTime)+' / '+fmt(video.duration);if(video.currentTime-lastSaved>5)save();}
function fail(message){statusEl.className='status hide';errorEl.innerHTML=message||'Не вдалося отримати відеопотік. Спробуй повторити пізніше.';errorEl.className='error';}
function requestJson(url,ok,bad){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText));}catch(e){bad(e);}}else{bad(new Error('HTTP '+x.status));}};x.onerror=function(){bad(new Error('Network error'));};x.send();}
function loadStream(){var endpoint=apiBase.replace(/\/$/,'')+'/api/stream?url='+encodeURIComponent('https://www.youtube.com/watch?v='+videoId);statusEl.innerHTML='Loading video…';statusEl.className='status';requestJson(endpoint,function(data){if(!data||!data.url){fail((data&&data.error)||'Backend не повернув відеопотік.');return;}video.onloadedmetadata=function(){var saved=parseFloat(localStorage.getItem(storageKey+videoId));statusEl.className='status hide';if(saved>5&&saved<video.duration-5)video.currentTime=saved;showOverlay();var p=video.play();if(p&&p.catch)p.catch(function(){});};video.onerror=function(){fail('VIDAA не зміг відкрити отриманий відеопотік. Спробуй інше відео.');};video.src=data.url;video.load();},function(){fail('Не вдалося підключитися до YouTube backend. Запусти GAP/Jupyter workflow і повтори.');});}
function loadConfig(){var configUrl='https://raw.githubusercontent.com/accesstopm-wq/Vibecode/main/youtube-player/backend-url.json?ts='+Date.now();requestJson(configUrl,function(cfg){apiBase=(cfg&&cfg.apiBase)||'';if(!apiBase){fail('YouTube backend зараз не запущений. Запусти GAP/Jupyter workflow і повтори.');return;}loadStream();},function(){fail('Не вдалося завантажити конфігурацію YouTube backend.');});}
function key(e){var k=e.keyCode||e.which;if([37,38,39,40,13,32,27,48,50,52,53,54,56].indexOf(k)>=0)e.preventDefault();
if(k===27){save();return;}
if(k===52||k===37){if(focusIndex===3)seek(-10);else if(focusIndex===1)setFocus(0);else setFocus(focusIndex-1);return;}
if(k===54||k===39){if(focusIndex===3)seek(10);else if(focusIndex===1)setFocus(2);else setFocus(focusIndex+1);return;}
if(k===50||k===38){if(focusIndex===3)setFocus(1);else if(focusIndex>0)setFocus(focusIndex-1);return;}
if(k===56||k===40){if(focusIndex===1)setFocus(3);else if(focusIndex<3)setFocus(focusIndex+1);return;}
if(k===53||k===13||k===32){if(focusIndex===0)seek(-10);else if(focusIndex===1)toggle();else if(focusIndex===2)seek(10);else showOverlay();return;}
if(k===48){if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}}
video.addEventListener('timeupdate',update,false);video.addEventListener('play',showOverlay,false);video.addEventListener('pause',showOverlay,false);video.addEventListener('click',toggle,false);video.addEventListener('ended',function(){if(videoId)localStorage.removeItem(storageKey+videoId);},false);document.addEventListener('keydown',key,false);document.addEventListener('visibilitychange',save,false);window.addEventListener('pagehide',save,false);window.addEventListener('beforeunload',save,false);
play.onclick=toggle;back10.onclick=function(){seek(-10);};forward10.onclick=function(){seek(10);};seekbar.onclick=function(e){var r=seekbar.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(isFinite(video.duration))video.currentTime=Math.max(0,Math.min(1,x))*video.duration;setFocus(3);};
videoId=parseYoutube(param('url'));
if(!videoId){fail('Відкрий сторінку з параметром ?url=YouTube_URL');return;}
loadConfig();
})();
</script>
</body>
</html>
