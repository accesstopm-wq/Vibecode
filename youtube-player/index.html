<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VIDAA YouTube Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.player{position:relative;width:100vw;height:100vh;background:#000;touch-action:manipulation}.video{width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;left:0;right:0;bottom:0;padding:18px 28px 28px;background:linear-gradient(transparent,rgba(0,0,0,.92));opacity:0;transition:opacity .12s;pointer-events:none}.overlay.visible{opacity:1;pointer-events:auto}.controls{display:flex;align-items:center;gap:14px}.btn{border:3px solid transparent;background:rgba(30,30,30,.94);color:#fff;border-radius:8px;min-width:104px;height:64px;font-size:25px;padding:0 18px;touch-action:manipulation}.btn:active{background:#555}.btn.focus{border-color:#fff;background:#333}.seekbar{height:20px;background:#555;border-radius:12px;margin:0 0 16px;position:relative;outline:3px solid transparent;touch-action:none;cursor:pointer}.seekbar.focus{outline-color:#fff}.seekfill{height:100%;width:0;background:#fff;border-radius:12px;pointer-events:none}.time{font-size:18px;min-width:150px}.status{position:absolute;top:24px;left:28px;font-size:18px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:5px}.status.hide{display:none}.error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:40px;box-sizing:border-box}.hidden{display:none!important}
@media (max-width:700px){.overlay{padding:14px 12px 22px}.controls{gap:10px}.btn{min-width:112px;height:72px;font-size:24px;padding:0 12px}.time{font-size:16px;min-width:105px}.seekbar{height:28px;margin-bottom:14px}.status{top:12px;left:12px;font-size:15px}}
</style>
</head>
<body>
<div class="player" id="player">
<video id="video" class="video" playsinline preload="auto"></video>
<div id="error" class="error hidden"></div>
<div id="status" class="status">Loading…</div>
<div id="overlay" class="overlay">
<div id="seekbar" class="seekbar"><div id="seekfill" class="seekfill"></div></div>
<div class="controls"><button class="btn" id="back10">↶ 10</button><button class="btn focus" id="play">▶ / ❚❚</button><button class="btn" id="forward10">10 ↷</button><span class="time" id="time">0:00 / 0:00</span></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.2/dist/hls.light.min.js"></script>
<script>
(function(){
'use strict';
var player=document.getElementById('player'),video=document.getElementById('video'),overlay=document.getElementById('overlay'),seekbar=document.getElementById('seekbar'),seekfill=document.getElementById('seekfill'),play=document.getElementById('play'),back10=document.getElementById('back10'),forward10=document.getElementById('forward10'),timeEl=document.getElementById('time'),statusEl=document.getElementById('status'),errorEl=document.getElementById('error');
var HLS=null,currentXHR=null,apiBase='',sourceUrl='',videoId='',streamStart=0,streamGeneration=0,totalDuration=0,focusIndex=1,overlayTimer=0,pendingTarget=null,seekTimer=0,loading=false,lastSave=0,storagePrefix='vidaa-yt-progress:',resumeAfterSeek=false,touchSeeking=false,touchTarget=0,seekSerial=0;
var controls=[back10,play,forward10,seekbar];
function param(name){var q=location.search.substring(1).split('&'),i,p,k;for(i=0;i<q.length;i++){p=q[i].split('=');k=decodeURIComponent(p[0]||'');if(k===name)return decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '));}return '';}
function parseYoutube(v){var m;if(!v)return '';v=v.trim();m=v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);if(m)return m[1];if(/^[A-Za-z0-9_-]{11}$/.test(v))return v;return '';}
function fmt(s){var h,m,x;if(!isFinite(s))s=0;s=Math.max(0,Math.floor(s));h=Math.floor(s/3600);m=Math.floor((s%3600)/60);x=s%60;return(h?h+':':'')+(h?(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x;}
function showOverlay(){overlay.className='overlay visible';if(overlayTimer)clearTimeout(overlayTimer);overlayTimer=setTimeout(function(){if(!video.paused&&!touchSeeking)overlay.className='overlay';},4000);}
function setFocus(i){var j;focusIndex=i;for(j=0;j<controls.length;j++)controls[j].className=controls[j].className.replace(/\s?focus/g,'');controls[focusIndex].className+=' focus';showOverlay();}
function getSaved(){var x=parseFloat(localStorage.getItem(storagePrefix+videoId));return isFinite(x)?x:0;}
function globalTime(){return Math.max(0,streamStart+(isFinite(video.currentTime)?video.currentTime:0));}
function save(){var t=globalTime();if(!videoId||!isFinite(t)||t<1)return;if(Date.now()-lastSave<1000)return;localStorage.setItem(storagePrefix+videoId,String(t));lastSave=Date.now();}
function setStatus(s){statusEl.innerHTML=s;statusEl.className='status';}
function hideStatus(){statusEl.className='status hide';}
function fail(s){loading=false;errorEl.innerHTML=s;errorEl.className='error';statusEl.className='status hide';}
function requestJson(url,ok,bad){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText));}catch(e){bad(new Error('Invalid JSON'));}}else bad(new Error('HTTP '+x.status));};x.onerror=function(){bad(new Error('Network error'));};x.onabort=function(){};x.send();return x;}
function loadConfig(){requestJson('backend-url.json?ts='+Date.now(),function(c){apiBase=(c&&c.apiBase)||c&&c.url||'';if(!apiBase){fail('Backend URL is missing.');return;}openStream(0,true,null);},function(){fail('Cannot load backend configuration.');});}
function destroyHls(){if(HLS){try{HLS.destroy();}catch(e){}HLS=null;}}
function cancelCurrentLoad(){seekSerial++;if(currentXHR){try{currentXHR.abort();}catch(e){}currentXHR=null;}destroyHls();loading=false;}
function finishSeekResume(){if(!resumeAfterSeek)return;resumeAfterSeek=false;var p=video.play();if(p&&p.catch)p.catch(function(){});showOverlay();}
function attachHls(url,start,autoplay,target,serial){destroyHls();streamStart=start;loading=true;HLS=new Hls({debug:false,maxBufferLength:30,backBufferLength:60,maxMaxBufferLength:120,enableWorker:true});HLS.on(Hls.Events.MANIFEST_PARSED,function(){if(serial!==seekSerial)return;hideStatus();loading=false;if(start===0){var saved=getSaved();if(saved>5&&saved<totalDuration-5)setTimeout(function(){seekAbsolute(saved,false);},50);}if(target!==null&&target!==undefined){try{video.currentTime=Math.max(0,target-streamStart);}catch(e){}}if(autoplay!==false){var p=video.play();if(p&&p.catch)p.catch(function(){});}showOverlay();update();});HLS.on(Hls.Events.LEVEL_LOADED,function(e,d){if(serial!==seekSerial)return;});HLS.on(Hls.Events.ERROR,function(e,d){if(serial!==seekSerial)return;if(!d||!d.fatal)return;if(d.type===Hls.ErrorTypes.NETWORK_ERROR){setStatus('Reconnecting…');try{HLS.startLoad();}catch(x){}}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){try{HLS.recoverMediaError();}catch(x){}}else fail('HLS playback error.');});video.onloadedmetadata=function(){if(serial!==seekSerial)return;if(isFinite(video.duration)&&video.duration>0&&totalDuration<=0)totalDuration=Math.max(totalDuration,streamStart+video.duration);update();};HLS.loadSource(url);HLS.attachMedia(video);}
function openStream(start,autoplay,target){var serial=++seekSerial;if(currentXHR){try{currentXHR.abort();}catch(e){}currentXHR=null;}destroyHls();resumeAfterSeek=autoplay!==false&&!video.paused;video.pause();loading=true;setStatus(start>0?'Seeking to '+fmt(start)+'…':'Loading video…');var url=apiBase.replace(/\/$/,'')+'/api/stream?url='+encodeURIComponent(sourceUrl)+'&start='+encodeURIComponent(String(Math.max(0,Math.floor(start))));currentXHR=requestJson(url,function(data){if(serial!==seekSerial)return;currentXHR=null;if(!data||!data.url){loading=false;fail((data&&data.error)||'Backend did not return a stream.');return;}streamStart=Number(data.start||0);streamGeneration=Number(data.generation||0);if(data.duration&&isFinite(Number(data.duration)))totalDuration=Number(data.duration);errorEl.className='error hidden';if(window.Hls&&Hls.isSupported())attachHls(data.url,streamStart,autoplay,target,serial);else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=data.url;video.load();video.onloadedmetadata=function(){if(serial!==seekSerial)return;loading=false;hideStatus();if(target!==null&&target!==undefined)try{video.currentTime=Math.max(0,target-streamStart);}catch(e){}if(autoplay!==false){var p=video.play();if(p&&p.catch)p.catch(function(){});}update();};}else{loading=false;fail('This VIDAA browser does not support HLS playback.');}},function(){if(serial!==seekSerial)return;currentXHR=null;loading=false;fail('Backend network error.');});}
function seekableGlobal(){var i;try{if(video.seekable&&video.seekable.length){i=video.seekable.length-1;return{start:streamStart+video.seekable.start(i),end:streamStart+video.seekable.end(i)};}}catch(e){}return null;}
function seekAbsolute(target,show){target=Math.max(0,target);if(totalDuration>0)target=Math.min(target,totalDuration);var r=seekableGlobal();if(!loading&&r&&target>=r.start-2&&target<=r.end+2){var serial=++seekSerial;resumeAfterSeek=!video.paused;video.pause();touchSeeking=true;if(seekTimer)clearTimeout(seekTimer);try{video.currentTime=Math.max(0,target-streamStart);}catch(e){}showOverlay();return;}pendingTarget=target;if(seekTimer)clearTimeout(seekTimer);var wasPlaying=resumeAfterSeek||!video.paused;resumeAfterSeek=wasPlaying;video.pause();if(loading)cancelCurrentLoad();touchSeeking=true;seekTimer=setTimeout(function(){var t=pendingTarget;pendingTarget=null;openStream(t,wasPlaying,t);},120);setStatus('Seeking to '+fmt(target)+'…');if(show!==false)showOverlay();}
function seekRelative(delta){seekAbsolute(Math.max(0,globalTime()+delta),true);}
function toggle(){if(video.paused){var p=video.play();if(p&&p.catch)p.catch(function(){});}else video.pause();showOverlay();}
function update(){var t=globalTime(),percent=totalDuration?(t/totalDuration*100):0;if(percent<0)percent=0;if(percent>100)percent=100;seekfill.style.width=percent+'%';timeEl.innerHTML=fmt(t)+' / '+fmt(totalDuration);if(t>0)save();}
function progressAt(clientX){var r=seekbar.getBoundingClientRect(),x=(clientX-r.left)/r.width;if(x<0)x=0;if(x>1)x=1;return(totalDuration||0)*x;}
function touchStart(e){if(e.touches&&e.touches.length){var t=e.touches[0],r=seekbar.getBoundingClientRect();if(t.clientY>=r.top-16&&t.clientY<=r.bottom+16){var wasPlaying=!video.paused;touchSeeking=true;touchTarget=progressAt(t.clientX);resumeAfterSeek=wasPlaying;video.pause();seekfill.style.width=(totalDuration?touchTarget/totalDuration*100:0)+'%';showOverlay();e.preventDefault();return;}}showOverlay();}
function touchMove(e){if(!touchSeeking||!e.touches||!e.touches.length)return;e.preventDefault();touchTarget=progressAt(e.touches[0].clientX);seekfill.style.width=(totalDuration?touchTarget/totalDuration*100:0)+'%';timeEl.innerHTML=fmt(touchTarget)+' / '+fmt(totalDuration);}
function touchEnd(){if(!touchSeeking)return;var t=touchTarget;touchSeeking=false;seekAbsolute(t,true);}
function key(e){var k=e.keyCode||e.which;if([37,38,39,40,13,32,27,48,50,52,53,54,56].indexOf(k)>=0)e.preventDefault();if(k===27){save();return;}if(k===52||k===37){if(focusIndex===3)seekRelative(-10);else if(focusIndex===2)setFocus(1);else if(focusIndex===1)setFocus(0);return;}if(k===54||k===39){if(focusIndex===3)seekRelative(10);else if(focusIndex===0)setFocus(1);else if(focusIndex===1)setFocus(2);return;}if(k===50||k===38){if(focusIndex===3)setFocus(1);else setFocus(3);return;}if(k===56||k===40){if(focusIndex===3)setFocus(1);else setFocus(3);return;}if(k===53||k===13||k===32){if(overlay.className.indexOf('visible')<0){setFocus(1);toggle();return;}if(focusIndex===0)seekRelative(-10);else if(focusIndex===1)toggle();else if(focusIndex===2)seekRelative(10);else{showOverlay();setFocus(3);}return;}if(k===48){if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}}
seekbar.onclick=function(e){e.preventDefault();if(!totalDuration)return;seekAbsolute(progressAt(e.clientX),true);setFocus(3);};
play.onclick=function(e){if(e)e.stopPropagation();setFocus(1);toggle();};back10.onclick=function(e){if(e)e.stopPropagation();setFocus(0);seekRelative(-10);};forward10.onclick=function(e){if(e)e.stopPropagation();setFocus(2);seekRelative(10);};
player.addEventListener('click',function(e){if(e.target===player||e.target===video){if(overlay.className.indexOf('visible')<0){showOverlay();setFocus(1);}else toggle();}},false);
player.addEventListener('touchstart',touchStart,false);player.addEventListener('touchmove',touchMove,false);player.addEventListener('touchend',touchEnd,false);
video.addEventListener('timeupdate',update,false);video.addEventListener('seeked',function(){touchSeeking=false;finishSeekResume();},false);video.addEventListener('play',showOverlay,false);video.addEventListener('pause',showOverlay,false);video.addEventListener('ended',function(){if(videoId)localStorage.removeItem(storagePrefix+videoId);},false);video.addEventListener('error',function(){if(!loading)fail('VIDAA could not play the HLS stream.');},false);document.addEventListener('keydown',key,false);document.addEventListener('visibilitychange',save,false);window.addEventListener('pagehide',save,false);window.addEventListener('beforeunload',save,false);
sourceUrl=param('url');videoId=parseYoutube(sourceUrl);if(!sourceUrl||!videoId){fail('Open the player with ?url=YouTube_URL');return;}loadConfig();
})();
</script>
</body>
</html>
