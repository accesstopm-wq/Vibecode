<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDAA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101114;color:#fff;font-family:Arial,sans-serif}body{padding:20px}#result{width:100%;height:100%;white-space:pre-wrap;word-break:break-all;font-size:22px;line-height:1.35;overflow:hidden}
</style>
</head>
<body><div id="result"></div>
<script>
(() => {
const result=document.getElementById('result');
const modern=typeof window.HiUtils_createRequest==='function';
let pages=[];
let pageIndex=0;
const PAGE_SIZE=100;

function renderPage(){
  result.textContent=pages.length?pages[pageIndex]:'(порожньо)';
}

function makePages(text){
  pages=[];
  for(let i=0;i<text.length;i+=PAGE_SIZE) pages.push(text.slice(i,i+PAGE_SIZE));
  if(!pages.length) pages=['(порожньо)'];
  pageIndex=0;
  renderPage();
}

function readAppInfo(){
  if(!modern){makePages('HiUtils_createRequest недоступний.');return;}
  try{
    const r=window.HiUtils_createRequest('fileRead',{path:'websdk/Appinfo.json',mode:6});
    let text;
    try{text=JSON.stringify(r,null,2)}catch(e){text=String(r)}
    makePages(text);
  }catch(e){
    makePages('ПОМИЛКА:\n'+(e&&e.stack?e.stack:String(e)));
  }
}

function prevPage(){if(pageIndex>0){pageIndex--;renderPage();}}
function nextPage(){if(pageIndex<pages.length-1){pageIndex++;renderPage();}}

function onKey(e){
  const code=e.keyCode||e.which;
  if(e.key==='5'||code===53){e.preventDefault();e.stopPropagation();readAppInfo();return;}
  if(e.key==='2'||code===50){e.preventDefault();e.stopPropagation();prevPage();return;}
  if(e.key==='8'||code===56){e.preventDefault();e.stopPropagation();nextPage();return;}
}
window.addEventListener('keydown',onKey,true);
document.addEventListener('keydown',onKey,true);
window.addEventListener('keypress',onKey,true);
document.addEventListener('keypress',onKey,true);
readAppInfo();
})();
</script></body></html>
