<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDAA API Test</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#fff;font-family:Arial,sans-serif;font-size:28px}main{padding:40px;max-width:1100px;margin:auto}h1{font-size:42px}.card{border:2px solid #555;border-radius:14px;padding:24px;margin:18px 0}.ok{color:#72ff72}.bad{color:#ff7070}.warn{color:#ffd45a}#result{white-space:pre-wrap;word-break:break-word;font-size:22px;line-height:1.4}.hint{font-size:30px}.key{font-size:48px;font-weight:bold}</style>
</head>
<body><main>
<h1>VIDAA — API TEST</h1>
<div class="card"><div id="firmware">Перевіряю…</div><div id="api"></div></div>
<div class="card"><div class="hint">Натисни на пульті:</div><div class="key">5</div><div>для читання Appinfo.json</div></div>
<div class="card"><div id="result">Очікую натискання 5…</div></div>
<script>
(() => {
const $=id=>document.getElementById(id);
const modern=typeof window.HiUtils_createRequest==='function';
let fw=null,model=null;
try{fw=typeof window.Hisense_GetFirmWareVersion==='function'?window.Hisense_GetFirmWareVersion():null}catch(e){}
try{model=typeof window.Hisense_GetModelName==='function'?window.Hisense_GetModelName():null}catch(e){}
$('firmware').textContent=`Firmware: ${fw||'невідомо'}${model?' | Model: '+model:''}`;
$('api').innerHTML=`HiUtils_createRequest: <span class="${modern?'ok':'bad'}">${modern?'ДОСТУПНИЙ':'НЕМАЄ'}</span>`;

function showObject(label,obj){
  try{$('result').textContent=label+'\n'+JSON.stringify(obj,null,2);}catch(e){$('result').textContent=label+'\n'+String(obj)+'\n\nJSON.stringify ПОМИЛКА:\n'+String(e);}
}
function readAppInfo(){
  if(!modern){$('result').textContent='HiUtils_createRequest недоступний.';return;}
  $('result').textContent='Читаю Appinfo.json…';
  try{
    const r=window.HiUtils_createRequest('fileRead',{path:'websdk/Appinfo.json',mode:6});
    showObject('ПОВНА ВІДПОВІДЬ HiUtils_createRequest:',r);
  }catch(e){showObject('ПОМИЛКА ВИКЛИКУ:',{name:e&&e.name,message:e&&e.message,stack:e&&e.stack,String:String(e)});}
}

function onKey(e){
  const code=e.keyCode||e.which;
  if(e.key==='5'||code===53){
    e.preventDefault();
    e.stopPropagation();
    readAppInfo();
  }
}
window.addEventListener('keydown',onKey,true);
document.addEventListener('keydown',onKey,true);
window.addEventListener('keypress',onKey,true);
document.addEventListener('keypress',onKey,true);
})();
</script></body></html>
