<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Встановити VIDAA Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101114;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.box{width:80%;max-width:900px;text-align:center}.icon{width:180px;height:180px;margin:auto auto 28px}.title{font-size:42px;font-weight:bold;margin-bottom:18px}p{font-size:24px;color:#bbb;line-height:1.4}button{font-size:30px;padding:18px 40px;border-radius:14px;border:3px solid #888;background:#252932;color:#fff}button:focus{outline:4px solid #fff}#status{margin-top:24px;font-size:24px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <img class="icon" src="icon.svg" alt="VIDAA Player">
  <div class="title">VIDAA Player</div>
  <p>Встановить плеєр у меню застосунків телевізора.</p>
  <button id="install">Встановити</button>
  <div id="status"></div>
</div>
<script>
(() => {
  const status=document.getElementById('status');
  const button=document.getElementById('install');
  const appUrl='https://accesstopm-wq.github.io/Vibecode/vidaa-player/';
  const icon='https://accesstopm-wq.github.io/Vibecode/vidaa-installer/icon.svg';

  function msg(s){status.textContent=s}
  function install(){
    const fn=window.Hisense_installApp;
    if(typeof fn!=='function'){
      msg('Hisense_installApp недоступний на цій сторінці/прошивці.\n\nДля нових VIDAA ця функція може бути дозволена лише через vidaahub.com.');
      return;
    }
    button.disabled=true;
    msg('Встановлення…');
    try{
      fn('vidaa_player_debug','VIDAA Player',icon,icon,icon,appUrl,'store',function(result){
        msg('Callback: '+String(result)+'\nЯкщо іконка не зʼявилась — відкрий Apps/Launcher та онови список.');
        button.disabled=false;
      });
    }catch(e){
      msg('Помилка: '+String(e));
      button.disabled=false;
    }
  }
  button.addEventListener('click',install);
  window.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='OK'||e.keyCode===13||e.keyCode===352){e.preventDefault();install()}},true);
  try{if(typeof window.Hisense_SetRemoteKeyboard==='function')window.Hisense_SetRemoteKeyboard();}catch(e){}
  button.focus();
})();
</script>
</body>
</html>
