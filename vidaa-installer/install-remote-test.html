<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIDAA API Probe</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101114;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.box{width:90%;max-width:1100px;text-align:center}.title{font-size:42px;font-weight:bold;margin-bottom:22px}p{font-size:30px;font-weight:bold;line-height:1.5}#status{margin-top:24px;font-size:22px;white-space:pre-wrap;word-break:break-word;text-align:left;max-height:70vh;overflow:auto;color:#ddd}
</style>
</head>
<body>
<div class="box">
<div class="title">VIDAA API Probe</div>
<p>НАТИСНИ 5 — ПЕРЕВІРИТИ HiUtils</p>
<div id="status"></div>
</div>
<script>
(()=>{
 const status=document.getElementById('status');
 const out=[];
 const show=()=>status.textContent=out.join('\n\n');
 const safe=v=>{try{return JSON.stringify(v)}catch(e){return String(v)}};
 function run(){
  out.length=0; show();
  const req=window.HiUtils_createRequest;
  out.push('HiUtils_createRequest: '+typeof req);
  if(typeof req!=='function'){show();return}
  try{out.push('length: '+req.length);out.push('source:\n'+Function.prototype.toString.call(req).slice(0,1800))}catch(e){out.push('source error: '+e)}
  const tests=[
   ['websdk/Appinfo.json',6],
   ['websdk/Appinfo.json',0],
   ['websdk/AppInfo.json',6],
   ['/APPS/websdk/Appinfo.json',6]
  ];
  for(const [path,mode] of tests){
   try{
    const r=req('fileRead',{path:path,mode:mode});
    out.push('TEST path='+path+' mode='+mode+'\nRETURN: '+safe(r));
   }catch(e){out.push('TEST path='+path+' mode='+mode+'\nEXCEPTION: '+String(e))}
  }
  show();
 }
 window.addEventListener('keydown',e=>{if(String(e.key||'')==='5'||e.keyCode===53||e.which===53){e.preventDefault();run()}},true);
})();
</script>
</body>
</html>
