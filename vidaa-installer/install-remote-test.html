<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Встановити Remote Test</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101114;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.box{width:80%;max-width:900px;text-align:center}.icon{width:180px;height:180px;margin:auto auto 28px}.title{font-size:42px;font-weight:bold;margin-bottom:18px}p{font-size:30px;color:#fff;line-height:1.5;font-weight:bold}#status{margin-top:24px;font-size:24px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <img class="icon" src="icon.svg" alt="Remote Test">
  <div class="title">VIDAA Remote Test</div>
  <p>НАТИСНИ 5 НА ПУЛЬТІ — ВСТАНОВИТИ</p>
  <div id="status"></div>
</div>
<script>
(() => {
  const status=document.getElementById('status');
  const appUrl='https://accesstopm-wq.github.io/Vibecode/vidaa-remote-test/';
  const icon='https://accesstopm-wq.github.io/Vibecode/vidaa-installer/icon.svg';
  function msg(s){status.textContent=s}
  function install(){
    const fn=window.Hisense_installApp;
    if(typeof fn!=='function'){
      msg('Hisense_installApp недоступний на цій сторінці/прошивці.\n\nДля нових VIDAA ця функція може бути дозволена лише через vidaahub.com.');
      return;
    }
    msg('Встановлення…');
    try{
      fn('vidaa_remote_test_debug','VIDAA Remote Test',icon,icon,icon,appUrl,'store',function(result){
        msg('Callback: '+String(result)+'\nЯкщо іконка не зʼявилась — відкрий Apps/Launcher та онови список.');
      });
    }catch(e){msg('Помилка: '+String(e))}
  }
  window.addEventListener('keydown',e=>{
    const key=String(e.key||'').toLowerCase();
    if(key==='5'||e.keyCode===53||e.which===53){e.preventDefault();install();}
  },true);
})();
</script>
</body>
</html>
