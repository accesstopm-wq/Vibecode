<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDAA Remote Diagnostic</title><style>html,body{margin:0;width:100%;height:100%;background:#101114;color:#fff;font-family:Arial}body{display:flex;align-items:center;justify-content:center}.box{width:92%;max-width:1100px}.title{font-size:38px;font-weight:bold}.status{font-size:26px;margin:15px 0}.log{height:55vh;overflow:auto;background:#181a1f;padding:16px;white-space:pre-wrap;font-size:22px;border-radius:10px}.keys{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}button{font-size:26px;padding:12px 25px;background:#222;color:#fff;border:3px solid #777;border-radius:10px}button:focus{outline:5px solid #4da3ff;background:#fff;color:#000}</style></head><body><div class="box"><div class="title">VIDAA Remote Diagnostic</div><div id="status" class="status">Натискай пульт. Події з'являться нижче.</div><div id="log" class="log"></div><div class="keys"><button id="run">TEST 5</button><button id="clear">CLEAR</button></div></div><script>(()=>{const log=document.getElementById('log'),status=document.getElementById('status');let n=0;function add(s){n++;log.textContent=('['+n+'] '+s+'\n\n'+log.textContent).slice(0,18000)}function key(e){status.textContent='KEY EVENT: '+e.type+' / key='+String(e.key)+' / code='+String(e.keyCode)+' / which='+String(e.which);add(e.type+' key='+String(e.key)+' code='+String(e.keyCode)+' which='+String(e.which)+' repeat='+String(e.repeat)+' target='+String(e.target&&e.target.tagName));}['keydown','keyup','keypress'].forEach(t=>document.addEventListener(t,key,true));['focus','blur','click'].forEach(t=>document.addEventListener(t,e=>add('MOUSE/FOCUS '+t+' target='+String(e.target&&e.target.id||e.target&&e.target.tagName)),true));try{add('Hisense_SetRemoteKeyboard typeof='+typeof window.Hisense_SetRemoteKeyboard);if(typeof window.Hisense_SetRemoteKeyboard==='function')add('Hisense_SetRemoteKeyboard result='+String(window.Hisense_SetRemoteKeyboard()));}catch(e){add('Remote API ERROR '+String(e))}document.getElementById('run').onclick=()=>{add('BUTTON TEST 5 CLICKED');try{if(typeof window.HiUtils_createRequest==='function'){const r=window.HiUtils_createRequest('fileRead',{path:'websdk/Appinfo.json',mode:6});add('HiUtils result='+JSON.stringify(r));}else add('HiUtils absent')}catch(e){add('HiUtils ERROR '+String(e))}};document.getElementById('clear').onclick=()=>{log.textContent='';n=0};setTimeout(()=>document.getElementById('run').focus(),300)})();</script></body></html>
