<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c0c0c0"><link rel="manifest" href="manifest.json"><title>Minesweeper</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#c0c0c0;color:#000;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.toolbar{height:76px;display:flex;align-items:center;gap:5px;padding:5px;overflow-x:auto;flex:none}.btn{height:64px;min-width:78px;border:2px outset #eee;background:#c0c0c0;font-size:25px;touch-action:manipulation}.counter{height:64px;min-width:90px;display:grid;place-items:center;background:#a0a0a0;font-size:22px}.zoom{min-width:70px;text-align:center;font-size:20px}.viewport{flex:1;overflow:auto;position:relative}.board{position:relative;display:grid;background:#808080;transform-origin:0 0}.cell{position:relative;display:grid;place-items:center;font-weight:bold;user-select:none}.closed{background:#c0c0c0;border-top:3px solid #fff;border-left:3px solid #fff;border-right:3px solid #808080;border-bottom:3px solid #808080}.open{background:#c3c3c3;border:1px solid #7d7d7d}.n1{color:#00f}.n2{color:#008000}.n3{color:red}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}.flag:after{content:'⚑';color:red;font-size:.65em}.mine:after{content:'●';color:red;font-size:.55em}.mine:before{content:'✳';color:#000;position:absolute;font-size:.7em}.status{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:42px;text-shadow:2px 2px #fff}.show{display:flex}</style></head><body><div class="app"><div class="toolbar"><button class="btn" id="mode">⛏</button><button class="btn" data-size="9,9,10">9×9</button><button class="btn" data-size="16,16,40">16×16</button><button class="btn" data-size="30,16,99">30×16</button><div class="counter" id="counter">💣 10</div><button class="btn" id="new">🙂</button><div class="zoom" id="zoom">100%</div></div><div class="viewport" id="viewport"><div class="board" id="board"></div><div class="status" id="status"></div></div></div><script src="app.js"></script></body></html>
